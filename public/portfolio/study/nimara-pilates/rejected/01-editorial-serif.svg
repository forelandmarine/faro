<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <style>
    .word { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; }
    .sub  { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; }
  </style>

  <!-- Mark: single hairline rail, left of wordmark -->
  <line x1="20" y1="60" x2="80" y2="60" stroke="#1A1A1A" stroke-width="1" />

  <!-- Wordmark -->
  <text x="100" y="74" class="word" font-size="56" letter-spacing="6" fill="#1A1A1A">NIMARA</text>

  <!-- Sub-line -->
  <text x="102" y="98" class="sub" font-size="9" letter-spacing="3.5" fill="#6E8A6A">REFORMER PILATES</text>
</svg>
