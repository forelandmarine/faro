<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <style>
    .word { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 400; }
    .sub  { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; }
  </style>

  <!-- Mark: architectural N monogram, hairline-built -->
  <g stroke="#1A1A1A" stroke-width="1.4" fill="none">
    <line x1="22" y1="32" x2="22" y2="88" />
    <line x1="62" y1="32" x2="62" y2="88" />
    <line x1="22" y1="32" x2="62" y2="88" />
  </g>

  <!-- Wordmark: precise modernist sans, wide-tracked -->
  <text x="100" y="68" class="word" font-size="36" letter-spacing="8" fill="#1A1A1A">NIMARA</text>

  <!-- Sub-line -->
  <text x="102" y="92" class="sub" font-size="9" letter-spacing="4" fill="#6E8A6A">REFORMER PILATES</text>
</svg>
