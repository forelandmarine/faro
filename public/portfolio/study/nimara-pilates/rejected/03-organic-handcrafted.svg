<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <style>
    .word { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-style: italic; }
    .sub  { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; }
  </style>

  <!-- Mark: single confident brushstroke arc (breath/body arc) -->
  <path
    d="M 22 78 Q 38 28, 62 32 Q 78 36, 78 56"
    stroke="#1A1A1A"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Wordmark: warm italic serif, sentence-case for warmth -->
  <text x="100" y="74" class="word" font-size="56" letter-spacing="2" fill="#1A1A1A">Nimara</text>

  <!-- Sub-line -->
  <text x="103" y="98" class="sub" font-size="9" letter-spacing="3.5" fill="#6E8A6A">REFORMER PILATES</text>
</svg>
