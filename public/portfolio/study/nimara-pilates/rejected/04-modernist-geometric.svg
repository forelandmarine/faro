<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <style>
    .word { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; }
    .sub  { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; }
  </style>

  <!-- Mark: circle bisected by a single horizontal line — balance / carriage path -->
  <g stroke="#7E9A7A" stroke-width="1.4" fill="none">
    <circle cx="46" cy="60" r="26" />
    <line x1="10" y1="60" x2="82" y2="60" />
  </g>

  <!-- Wordmark: geometric sans, uppercase, generously tracked -->
  <text x="106" y="68" class="word" font-size="32" letter-spacing="10" fill="#7E9A7A">NIMARA</text>

  <!-- Sub-line -->
  <text x="108" y="92" class="sub" font-size="9" letter-spacing="4" fill="#7E9A7A">REFORMER PILATES</text>
</svg>
