<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none">
  <style>
    .word { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; }
    .sub  { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; }
  </style>

  <!-- Upper rule -->
  <line x1="180" y1="56" x2="420" y2="56" stroke="#7E9A7A" stroke-width="1.4" />

  <!-- Wordmark -->
  <text x="300" y="118" class="word" font-size="60" letter-spacing="10" fill="#1A1A1A" text-anchor="middle">NIMARA</text>

  <!-- Sub-line -->
  <text x="300" y="142" class="sub" font-size="10" letter-spacing="3.6" fill="#7E9A7A" text-anchor="middle">REFORMER PILATES</text>

  <!-- Lower rule -->
  <line x1="180" y1="160" x2="420" y2="160" stroke="#7E9A7A" stroke-width="1.4" />
</svg>
