<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none">
  <style>
    .word { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; }
    .sub  { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; }
  </style>

  <!-- Solid sage panel, like a journal cover or publisher's spine label -->
  <rect x="160" y="40" width="280" height="100" fill="#7E9A7A" />

  <!-- Wordmark reversed out -->
  <text x="300" y="100" class="word" font-size="50" letter-spacing="8" fill="#F7F3ED" text-anchor="middle">NIMARA</text>

  <!-- Sub-line below the block, on the surrounding surface -->
  <text x="300" y="172" class="sub" font-size="10" letter-spacing="3.6" fill="#7E9A7A" text-anchor="middle">REFORMER PILATES</text>
</svg>
