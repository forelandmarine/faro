<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none">
  <style>
    .word { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; }
    .sub  { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; }
  </style>

  <!-- Wordmark left -->
  <text x="120" y="118" class="word" font-size="56" letter-spacing="10" fill="#1A1A1A">NIMARA</text>

  <!-- Sage square as editorial punctuation between mark and descriptor -->
  <rect x="358" y="100" width="8" height="8" fill="#7E9A7A" />

  <!-- Descriptor right -->
  <text x="385" y="113" class="sub" font-size="11" letter-spacing="3.6" fill="#1A1A1A">REFORMER PILATES</text>
</svg>
